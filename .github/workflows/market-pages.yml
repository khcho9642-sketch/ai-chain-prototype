name: Market data and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC: Asian markets, Singapore, Europe, then Americas; includes Sunday markets.
    - cron: '20 8,10,18,23 * * *'
permissions:
  contents: read
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked server dependencies
        run: npm ci

      - name: Test data handling
        run: npm test
      - name: Restore previous deployed snapshot for failure fallback
        run: |
          curl --fail --silent --show-error --max-time 20 https://khcho9642-sketch.github.io/ai-chain-prototype/data/market.json -o data/previous.json && mv data/previous.json data/market.json || true
      - name: Collect completed daily closes and batch capitalizations
        id: collect
        continue-on-error: true
        run: node scripts/data/collect-market.mjs
      - name: Build same-session ripple observations from collected closes
        run: node scripts/data/build-ripple.mjs --allow-unavailable
      - name: Restore previous industry statistics for failure fallback
        run: |
          curl --fail --silent --show-error --max-time 20 https://khcho9642-sketch.github.io/ai-chain-prototype/data/industry.json -o data/industry-previous.json && mv data/industry-previous.json data/industry.json || true
      - name: Collect official monthly industry statistics
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
        run: node scripts/data/collect-industry.mjs ${{ github.event_name == 'workflow_dispatch' && '--force-customs' || '' }}
      - name: Restore validated public collector state
        run: node scripts/deployment/restore-ai-snapshots.mjs --with-comparison
      - name: Collect free Epoch AI datasets
        continue-on-error: true
        run: npm run collect:epoch -- --no-evidence
      - name: Collect three-year daily closes for company comparison
        continue-on-error: true
        run: npm run collect:comparison
      - name: Collect public OpenRouter token statistics
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run collect:tokens
      - name: Monitor official OpenAI and Anthropic disclosures
        continue-on-error: true
        run: npm run collect:disclosures
      - name: Collect official Korean company disclosures
        continue-on-error: true
        run: npm run collect:company-disclosures
      - name: Build static site
        env:
          COMMUNITY_API_ORIGIN: ${{ vars.COMMUNITY_API_ORIGIN }}
        run: |
          npm run build
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish actual data
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
