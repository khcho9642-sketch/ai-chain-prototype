<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지수 띠 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#14171c; --sub:#6b7280; --line:#e5e7eb;
    --up:#e5383b; --down:#1d6fe5; --flat:#6b7280; --accent:#5b4bff; --chip:#eef0f4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115; --card:#181b21; --text:#eef0f4; --sub:#9aa1ad; --line:#2a2f38;
      --up:#ff5a5f; --down:#4c8dff; --chip:#232831;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115; --card:#181b21; --text:#eef0f4; --sub:#9aa1ad; --line:#2a2f38;
    --up:#ff5a5f; --down:#4c8dff; --chip:#232831;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  .sample{display:inline-block;font-size:11px;color:var(--sub);background:var(--chip);border-radius:6px;padding:2px 8px;margin-bottom:12px}

  .strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
  .strip::-webkit-scrollbar{display:none}
  .idx{flex:1 0 140px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .idx.ai{border-color:var(--accent)}
  .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .badge{margin-left:auto;font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
  .val{font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .chg{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
  .meta{margin-top:6px;font-size:11px;color:var(--sub)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sub);margin-right:4px;vertical-align:middle}
  .dot.open{background:var(--accent)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
</style>
</head>
<body>
<div class="wrap">
  <span class="sample">시안 · 숫자는 샘플 데이터</span>
  <div class="strip" id="strip"></div>
</div>
<script>
const data = [
  {f:"🇺🇸", n:"나스닥",   v:18942.31, c: 1.24, s:"장마감", t:"11/6 16:00 ET"},
  {f:"🇺🇸", n:"S&P 500",  v: 6012.55, c: 0.68, s:"장마감", t:"11/6 16:00 ET"},
  {f:"🇺🇸", n:"반도체(SOX)", v: 5873.40, c: 2.37, s:"장마감", t:"11/6 16:00 ET", ai:true},
  {f:"🇰🇷", n:"코스피",   v: 2689.12, c: 0.95, s:"장마감", t:"11/7 15:30 KST"},
  {f:"🇰🇷", n:"코스닥",   v:  781.44, c:-0.42, s:"장마감", t:"11/7 15:30 KST"}
];
const fmt=(x)=>x.toLocaleString("ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=c=>c>0?"up":c<0?"down":"flat";
const arrow=c=>c>0?"▲":c<0?"▼":"–";
document.getElementById("strip").innerHTML = data.map(d=>`
  <div class="idx${d.ai?" ai":""}">
    <div class="top"><span>${d.f}</span>${d.n}${d.ai?'<span class="badge">AI</span>':""}</div>
    <div class="val">${fmt(d.v)}</div>
    <div class="chg ${cls(d.c)}">${arrow(d.c)} ${fmt(Math.abs(d.c))}%</div>
    <div class="meta"><span class="dot${d.s==="장중"?" open":""}"></span>${d.s} · ${d.t}</div>
  </div>`).join("");
</script>
</body>
</html>
